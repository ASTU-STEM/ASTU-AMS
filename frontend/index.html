<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/astu-seal-logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/astu-seal-logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/astu-seal-logo.png" />
    <link rel="shortcut icon" type="image/png" href="/images/astu-seal-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/astu-seal-logo.png" />
    <meta property="og:image" content="/images/astu-seal-logo.png" />
    <title>Alumni Portal | ASTU-AMS</title>
    <script>
      // Apply the stored theme before first paint. Without this the <html> stays
      // class="light" until React mounts, so a dark-mode user gets a full flash
      // of the light theme on every reload.
      (function () {
        try {
          var t = localStorage.getItem("theme") === "dark" ? "dark" : "light";
          var r = document.documentElement;
          r.classList.remove("light", "dark");
          r.classList.add(t);
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols also self-hosted via @fontsource in main.tsx for offline/reliable icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background font-body-md text-on-surface">
    <a
      id="skip-to-content"
      href="#main-content"
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100000] focus:rounded-lg focus:bg-[#003366] focus:px-4 focus:py-2 focus:text-sm focus:font-bold focus:text-white focus:shadow-lg"
    >
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
